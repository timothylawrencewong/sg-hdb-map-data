name: Refresh town page data

# Weekly refresh of the town pages (every HDB, condo and landed sale).
# Light job: it only reads the HDB resale file from data.gov.sg plus the data/ and private_data/
# folders already saved in the repo, so it does not repeat the long map build.
# Put this file in .github/workflows/ . To add a town, add its name to the command below.

on:
  schedule:
    - cron: '0 22 * * 0'     # every Sunday 22:00 UTC = Monday 6:00 am Singapore time
  workflow_dispatch:         # adds the "Run workflow" button on the Actions tab

permissions:
  contents: write            # lets this job save the new data into the repo

# Same group name as the monthly "Refresh map data" job, so the two never run at the same time.
concurrency:
  group: refresh-map-data
  cancel-in-progress: false

jobs:
  town-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the town page data
        run: python3 miji_town_build.py "Bukit Panjang"

      - name: Check the town page data before using it
        run: |
          python3 - <<'PY'
          import json, os, sys
          path = "town_data/bukit-panjang.json"
          if not os.path.exists(path):
              sys.exit("STOP: no town_data/bukit-panjang.json. The live town data is unchanged.")
          with open(path, encoding="utf-8") as f:
              d = json.load(f)
          n = len(d.get("hdb", {}).get("rows", []))
          if n < 1500:
              sys.exit("STOP: only %d HDB sales for Bukit Panjang (expected thousands). The live town data is unchanged." % n)
          print("OK: %d HDB sales, %d private sales, built %s" % (n, len(d.get("private", {}).get("rows", [])), d.get("built")))
          PY

      - name: Publish the town page data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add town_data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Weekly town page refresh $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
