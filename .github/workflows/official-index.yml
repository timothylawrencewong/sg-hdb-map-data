name: Official Miji Index

# Copies the government's own published price figures into index_data/official_index.json:
#   HDB Resale Price Index, URA private index (all / landed / non-landed),
#   URA non-landed index by CCR / RCR / OCR, and HDB's median resale price by town and flat type.
# Miji calculates nothing here. HDB and URA update these quarterly (around the 4th Friday of
# Jan, Apr, Jul and Oct), so a weekly run picks up each release within a few days.

on:
  schedule:
    - cron: '0 3 * * 1'      # every Monday, 11:00 Singapore time
  workflow_dispatch:         # adds the "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: official-miji-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The script stops with a STOP message (and writes nothing) if anything looks wrong,
      # so the live file is only replaced by a complete, checked one.
      - name: Collect the official figures
        run: python3 official_index_build.py

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index_data/official_index.json
          if git diff --cached --quiet; then
            echo "No new official figures this week."
          else
            git commit -m "Official index refresh $(date -u +%Y-%m-%d)"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
