name: ML price estimates

# Retrains Miji's HDB price model (LightGBM) on the full HDB resale history
# (Jan 2017 onwards, data.gov.sg), checks its accuracy on the
# most recent 3 months, and republishes estimates/<town>.json + estimates/index.json
# (read by Jimi's estimate_price tool). Runs monthly, after the data refresh.
# If accuracy gets worse than the limit below, nothing is published.

on:
  schedule:
    - cron: '0 6 5 * *'   # the 5th of every month, 2pm Singapore time
  workflow_dispatch:
  push:
    branches: [ml-price-estimates]   # so the branch gets real estimates before it is merged
    paths: ['ml/train.py', 'ml/predict.py', '.github/workflows/ml-price-estimates.yml']

permissions:
  contents: write

concurrency:
  group: ml-price-estimates
  cancel-in-progress: false

jobs:
  estimates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -r ml/requirements.txt

      - name: Train and test
        env:
          FULL_HISTORY: '1'
          PYTHONUNBUFFERED: '1'
        run: python3 ml/train.py

      - name: Check accuracy before publishing
        run: |
          python3 - <<'PY'
          import json, os, sys
          r = json.load(open("ml/report.json"))
          print("Median error %.2f%%, within 10%%: %.1f%%" % (r["median_ape_pct"], r["within_10pct"]))
          if r["median_ape_pct"] > 6 or r["within_10pct"] < 85 or r.get("history_from", 0) > 201801:
              sys.exit("STOP: accuracy worse than the limit. Nothing was published.")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write("SUMMARY=median error %.2f%%, %.1f%% within 10%%\n" % (r["median_ape_pct"], r["within_10pct"]))
          PY

      - name: Build estimates
        env:
          FULL_HISTORY: '1'
        run: python3 ml/predict.py

      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estimates ml/report.json ml/miji_price_meta.json ml/miji_price_model.txt
          if git diff --cached --quiet; then
            echo "Nothing changed since the last run."
          else
            git commit -m "ML price estimates: $SUMMARY"
            git pull --rebase --autostash origin "$GITHUB_REF_NAME"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
