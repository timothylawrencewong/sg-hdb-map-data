name: Refresh town page data

# DAILY refresh of the town pages (every HDB, condo and landed sale). The file name still says
# "weekly" so you can simply overwrite the old file; it now runs every day.
# Light job: it only reads the HDB resale file from data.gov.sg plus the data/ and private_data/
# folders already saved in the repo, so it does not repeat the long map build.
# Builds EVERY town in one go. Put this file in .github/workflows/ .

on:
  schedule:
    - cron: '30 22 * * *'    # every day 22:30 UTC = 6:30 am Singapore time (HDB updates its data daily)
  workflow_dispatch:         # adds the "Run workflow" button on the Actions tab

permissions:
  contents: write            # lets this job save the new data into the repo

# Same group name as the monthly "Refresh map data" job, so the two never run at the same time.
concurrency:
  group: refresh-map-data
  cancel-in-progress: false

jobs:
  town-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build the town page data
        run: python3 miji_town_build.py

      - name: Check the town page data before using it
        run: |
          python3 - <<'PY'
          import json, os, sys
          idx_path = "town_data/index.json"
          if not os.path.exists(idx_path):
              sys.exit("STOP: no town_data/index.json. The live town data is unchanged.")
          with open(idx_path, encoding="utf-8") as f:
              towns = json.load(f).get("towns", [])
          if len(towns) < 20:
              sys.exit("STOP: only %d towns built (expected 20+). The live town data is unchanged." % len(towns))
          bad = []
          for t in towns:
              p = "town_data/%s.json" % t["slug"]
              if not os.path.exists(p) or t.get("hdb_sales", 0) < 50:
                  bad.append(t["name"])
          if bad:
              sys.exit("STOP: these towns look wrong: %s. The live town data is unchanged." % ", ".join(bad))
          print("OK: %d towns, %d HDB sales in total" % (len(towns), sum(t["hdb_sales"] for t in towns)))
          PY

      # The data is published to its own branch called town-data, as a single fresh commit each time
      # (the old one is replaced). That way a daily refresh never makes your repo bigger.
      - name: Publish the town page data
        run: |
          set -e
          rm -rf /tmp/pub && mkdir /tmp/pub
          cp town_data/*.json /tmp/pub/
          cd /tmp/pub
          git init -q -b town-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "Town page data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" town-data
