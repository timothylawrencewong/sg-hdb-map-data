name: ML feature experiment

# Temporary: runs on the ml-price-estimates branch only. Tests extra location and block
# features on the full HDB history and commits ml/report_features.json to that branch.
# Nothing is published to the live site.

on:
  push:
    branches: [ml-price-estimates]
    paths: ['ml/compare_features.py', '.github/workflows/ml-feature-test.yml']

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ml/requirements.txt
      - name: Compare
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 ml/compare_features.py
      - name: Save the report to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/report_features.json
          git commit -m "ML feature experiment report" || exit 0
          git pull --rebase origin ml-price-estimates
          git push origin HEAD:ml-price-estimates
