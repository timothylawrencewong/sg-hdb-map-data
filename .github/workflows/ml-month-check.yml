name: ML month check

# Temporary: runs on the ml-checks branch only. Nothing is published to the live site.

on:
  push:
    branches: [ml-checks]

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ml/requirements.txt
      - env:
          PYTHONUNBUFFERED: '1'
        run: python3 ml/check_months.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/report_months.json
          git commit -m "ML month check report" || exit 0
          git push origin HEAD:ml-checks
