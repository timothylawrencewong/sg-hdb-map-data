name: ML full-history experiment

# Temporary: runs on the ml-price-estimates branch only, compares training on the full
# HDB history against the 12-month model, and commits ml/report_full.json to that branch.
# Nothing is published to the live site.

on:
  push:
    branches: [ml-price-estimates]
    paths: ['ml/compare_full.py', '.github/workflows/ml-full-history-test.yml']

permissions:
  contents: write

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r ml/requirements.txt
      - name: Compare
        env:
          PYTHONUNBUFFERED: '1'
        run: python3 ml/compare_full.py
      - name: Save the report to the branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ml/report_full.json
          git commit -m "ML full-history experiment report" || exit 0
          git pull --rebase origin ml-price-estimates
          git push origin HEAD:ml-price-estimates
